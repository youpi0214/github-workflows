name: Publish trusted full security report
on:
  workflow_call:
    inputs:
      runner:
        description: Linux runner label used for jobs; defaults to the existing GitHub-hosted runner
        type: string
        default: ubuntu-24.04
      library-ref:
        description: Release version tag matching the calling security workflow version
        type: string
        required: true
      artifact-id:
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: security-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ inputs.artifact-id }}
          path: reports
      - name: Validate complete full-scan coverage
        shell: python
        run: |
          import json
          from pathlib import Path

          report = json.loads(Path('reports/report.json').read_text())
          if report['status'] not in ('CLEAN', 'FINDINGS') or report['failures']:
              raise ValueError('only complete reports may be published')
          if not report['scans'] or any(
              scan['component'] != 'repository' or scan['target'] != '.'
              for scan in report['scans']
          ):
              raise ValueError('only full scans may be published')

      - name: Generate UTC publication metadata
        id: publication
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const timestamp = new Date().toISOString().replace(/\.\d{3}Z$/, 'Z');
            const tag = `security-report-${timestamp.replaceAll(':', '-')}`;

            try {
              await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` });
            } catch (error) {
              if (error.status !== 404) throw error;

              core.setOutput('tag', tag);
              core.setOutput('timestamp', timestamp.replace('T', ' ').replace('Z', ' UTC'));
              return;
            }

            core.setFailed(`Historical tag ${tag} already exists. Rerun to generate a fresh publication timestamp.`);

      - name: Publish historical report
        id: history
        uses: softprops/action-gh-release@v3.0.4
        with:
          repository: ${{ github.repository }}
          tag_name: ${{ steps.publication.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Security audit — ${{ steps.publication.outputs.timestamp }}
          body: |
            Trusted full security audit. Download index.html to view the dashboard offline.

            Published: ${{ steps.publication.outputs.timestamp }}
            Branch: `${{ github.ref_name }}`
            Source revision: `${{ github.sha }}`
            Workflow: [Run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            Attempt: ${{ github.run_attempt }}
          make_latest: "false"
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            reports/index.html
            reports/report.json

      - name: Update latest report assets
        uses: softprops/action-gh-release@v3.0.4
        with:
          repository: ${{ github.repository }}
          tag_name: security-report-latest
          target_commitish: ${{ github.sha }}
          name: Security audit — latest report
          body: |
            Latest trusted full security audit. Download index.html to view the dashboard offline.

            Published: ${{ steps.publication.outputs.timestamp }}
            Branch: `${{ github.ref_name }}`
            Source revision: `${{ github.sha }}`
            Workflow: [Run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            Attempt: ${{ github.run_attempt }}
            Historical snapshot: ${{ steps.history.outputs.url }}
          make_latest: "false"
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            reports/index.html
            reports/report.json
