name: Security scan
on:
  workflow_call:
    inputs:
      library-ref:
        description: Release version tag of github-workflows; match the workflow uses version
        required: true
        type: string
      mode:
        description: >-
          Select selective to scan explicit or affected components, or full to scan the entire repository.
        type: string
        default: selective
      config-file:
        description: Repository-relative YAML component configuration
        type: string
        default: ""
      components:
        description: Optional JSON component-name list; overrides automatic selection
        type: string
        default: ""
      targets:
        description: JSON array of name, paths, and optional dependency-paths
        type: string
        default: ""
      scanners:
        description: >-
          JSON array of enabled scanners; supported values are semgrep and trivy. At least one is required.
        type: string
        default: '["semgrep","trivy"]'
      semgrep-rules:
        description: >-
          JSON array of Semgrep CE registry rulesets or repository-relative rule files/directories.
        type: string
        default: '["p/default"]'
      maven-cache-key:
        description: Optional caller-created cache key for ~/.m2/repository
        type: string
        default: ""
      trivy-offline-scan:
        description: Resolve dependencies locally; requires a populated cache for complete Maven coverage
        type: boolean
        default: false
      trivy-ignore-unfixed:
        description: >-
          Exclude dependency vulnerabilities without an available fix from Trivy results and enforcement.
        type: boolean
        default: false
      trivy-skip-dirs:
        description: >-
          JSON array of directories or Trivy directory patterns to exclude from scanning.
        type: string
        default: "[]"
      fail-severity:
        description: >-
          Fail on findings at this severity or higher. Accepts CRITICAL, HIGH, MEDIUM, LOW, INFO, UNKNOWN, or NONE.
        type: string
        default: HIGH
      enforce:
        description: >-
          Fail CI when findings meet fail-severity. Reports are generated first; scanner error enforcement is separate.
        type: boolean
        default: true
      fail-on-error:
        description: >-
          Fail CI on scanner errors or incomplete scans, independently of finding severity and enforce.
        type: boolean
        default: true
      pr-comment:
        description: >-
          Create or update one managed security summary comment on same-repository PRs; fork and Dependabot PRs are excluded.
        type: boolean
        default: false
      publish:
        description: >-
          Publish complete full-scan HTML and JSON reports to caller Releases on trusted default-branch push, scheduled, or manual runs.
        type: boolean
        default: false
      retention-days:
        description: >-
          Number of days to retain raw scan and unified report artifacts, subject to repository retention limits.
        type: number
        default: 30
    outputs:
      status:
        value: ${{ jobs.scan.outputs.status }}
      failed:
        value: ${{ jobs.scan.outputs.failed }}
      artifact-id:
        value: ${{ jobs.scan.outputs.artifact-id }}
        
jobs:
  plan:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      scan-required: ${{ steps.plan.outputs.scan-required }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: source
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@v7.0.1
        with:
          repository: youpi0214/github-workflows
          ref: ${{ inputs.library-ref }}
          path: library
          persist-credentials: false

      - name: Install component configuration parser
        if: inputs.config-file != '' && inputs.mode == 'selective'
        run: >-
          python3 -m pip install --disable-pip-version-check
          --target "$RUNNER_TEMP/security-python"
          --requirement library/scripts/security/requirements.txt

      - name: Validate configuration and plan scans
        id: plan
        env:
          SOURCE: ${{ github.workspace }}/source
          REPORTS: ${{ runner.temp }}/security-plan
          PYTHONPATH: ${{ runner.temp }}/security-python
          CONFIG_FILE: ${{ inputs.config-file }}
          COMPONENTS: ${{ inputs.components }}
          SCAN_EVENT: ${{ github.event_name }}
          SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SCAN_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          MODE: ${{ inputs.mode }}
          TARGETS: ${{ inputs.targets }}
          SCANNERS: ${{ inputs.scanners }}
          SEMGREP_RULES: ${{ inputs.semgrep-rules }}
          TRIVY_SKIP_DIRS: ${{ inputs.trivy-skip-dirs }}
        run: python3 library/scripts/security/plan.py

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: security-raw-plan
          path: ${{ runner.temp }}/security-plan
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error
          overwrite: true

  scanners:
    name: ${{ matrix.scanner }} / ${{ join(matrix.components, ', ') }} (${{ matrix.target }})
    needs: plan
    if: needs.plan.outputs.scan-required == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: source
          persist-credentials: false

      - uses: actions/checkout@v7.0.1
        with:
          repository: youpi0214/github-workflows
          ref: ${{ inputs.library-ref }}
          path: library
          persist-credentials: false

      - uses: ./library/actions/security-scan
        with:
          scope: ${{ toJSON(matrix) }}
          reports: ${{ runner.temp }}/security-raw
          semgrep-rules: ${{ inputs.semgrep-rules }}
          maven-cache-key: ${{ inputs.maven-cache-key }}
          trivy-offline-scan: ${{ inputs.trivy-offline-scan }}
          trivy-ignore-unfixed: ${{ inputs.trivy-ignore-unfixed }}
          trivy-skip-dirs: ${{ inputs.trivy-skip-dirs }}

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: security-raw-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/security-raw/*.json
            ${{ runner.temp }}/security-raw/*.log
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error
          overwrite: true

  scan:
    needs: [plan, scanners]
    if: always() && github.event_name != 'pull_request_target'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      status: ${{ steps.report.outputs.status }}
      failed: ${{ steps.report.outputs.failed }}
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: youpi0214/github-workflows
          ref: ${{ inputs.library-ref }}
          path: library
          persist-credentials: false

      - uses: actions/download-artifact@v8.0.2
        continue-on-error: true
        with:
          pattern: security-raw-*
          merge-multiple: true
          path: ${{ runner.temp }}/security-report

      - name: Generate unified reports
        id: report
        if: always()
        env:
          SCAN_OUTCOME: ${{ needs.plan.result == 'success' && (needs.scanners.result == 'success' || (needs.scanners.result == 'skipped' && needs.plan.outputs.scan-required == 'false')) && 'success' || 'failure' }}
          FAIL_SEVERITY: ${{ inputs.fail-severity }}
          ENFORCE: ${{ inputs.enforce }}
          FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}
        run: python3 library/scripts/security/report.py "$RUNNER_TEMP/security-report"

      - uses: actions/upload-artifact@v7.0.2
        id: artifact
        if: always()
        with:
          name: security-report
          path: ${{ runner.temp }}/security-report
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error
          overwrite: true

  comment:
    needs: scan
    if: >-
      always() && inputs.pr-comment && needs.scan.outputs.artifact-id != '' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: security-comment-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.scan.outputs.artifact-id }}
          path: reports
      - name: Update managed comment
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: reusable-security-report
          path: reports/summary.md
          skip_unchanged: true

  publish:
    needs: scan
    if: >-
      always() && inputs.publish && inputs.mode == 'full' &&
      (needs.scan.outputs.status == 'CLEAN' || needs.scan.outputs.status == 'FINDINGS') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    uses: ./.github/workflows/security-publish.yml
    permissions:
      contents: write
    with:
      library-ref: ${{ inputs.library-ref }}
      artifact-id: ${{ needs.scan.outputs.artifact-id }}
      
  enforce:
    needs: [scan, comment, publish]
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Enforce security policy after reporting
        env:
          RESULT: ${{ needs.scan.result }}
          FAILED: ${{ needs.scan.outputs.failed }}
          REPORT_STATUS: ${{ needs.scan.outputs.status }}
          COMMENT_RESULT: ${{ needs.comment.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          test "$RESULT" = success
          test -n "$REPORT_STATUS"
          test "$FAILED" = false
          test "$COMMENT_RESULT" != failure
          test "$PUBLISH_RESULT" != failure
