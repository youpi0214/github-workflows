name: Validate library
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install configuration parser for selection tests
        run: >-
          python3 -m pip install --disable-pip-version-check
          --target "$RUNNER_TEMP/security-python"
          --requirement scripts/security/requirements.txt
      - run: python3 -m unittest discover -s tests/security -v
        env:
          PYTHONPATH: ${{ runner.temp }}/security-python
      - run: python3 -m unittest discover -s tests/maven -v
      - run: node --test tests/releases/*.test.cjs
      - name: Install pinned actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          curl --fail --silent --show-error --location "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o /tmp/actionlint.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
      - run: /tmp/actionlint -shellcheck= .github/workflows/*.yml examples/security/*.yml
  scanner-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Prepare controlled scanner fixtures
        run: |
          mkdir -p "$RUNNER_TEMP/fixture"
          echo 'eval(input())' > "$RUNNER_TEMP/fixture/app.py"
          printf 'FROM alpine:3.20\nUSER root\n' > "$RUNNER_TEMP/fixture/Dockerfile"
          cat > "$RUNNER_TEMP/fixture/rules.yaml" <<'RULES'
          rules:
            - id: test-eval
              languages: [python]
              severity: ERROR
              message: Avoid eval
              pattern: eval(...)
          RULES
      - name: Exercise Semgrep integration
        uses: ./actions/security-scan
        with:
          source: ${{ runner.temp }}/fixture
          reports: ${{ runner.temp }}/smoke-reports
          scope: '{"scanner":"semgrep","target":".","file":"0.json"}'
          semgrep-rules: '["rules.yaml"]'

      - name: Exercise Trivy integration
        uses: ./actions/security-scan
        with:
          source: ${{ runner.temp }}/fixture
          reports: ${{ runner.temp }}/smoke-reports
          scope: '{"scanner":"trivy","target":".","file":"1.json"}'

      - name: Prepare a controlled Maven cache
        run: |
          mkdir -p "$HOME/.m2/repository/security-library-smoke"
          echo 'cached fixture' > "$HOME/.m2/repository/security-library-smoke/cache-marker.txt"

      - name: Save controlled Maven dependencies
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-smoke-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Remove local marker to verify restoration
        run: rm "$HOME/.m2/repository/security-library-smoke/cache-marker.txt"

      - name: Exercise Maven cache restoration and offline Trivy
        uses: ./actions/security-scan
        with:
          source: ${{ runner.temp }}/fixture
          reports: ${{ runner.temp }}/smoke-reports
          scope: '{"scanner":"trivy","target":".","file":"2.json"}'
          maven-cache-key: maven-smoke-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          trivy-offline-scan: "true"

      - name: Check scanner outcomes and unified reporting
        env:
          REPORTS: ${{ runner.temp }}/smoke-reports
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path

          reports = Path(os.environ['REPORTS'])
          records = [
              dict(scanner=scanner, component='repository', target='.', file=f'{index}.json', exit_code=-1)
              for index, scanner in enumerate(['semgrep', 'trivy', 'trivy'])
          ]
          (reports / 'manifest.json').write_text(json.dumps(records))
          PYTHON

          GITHUB_STEP_SUMMARY="$REPORTS/step-summary.md" \
          GITHUB_OUTPUT="$REPORTS/github-output" \
            python3 scripts/security/report.py "$REPORTS"

          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path

          report = json.loads((Path(os.environ['REPORTS']) / 'report.json').read_text())
          assert (Path.home() / '.m2/repository/security-library-smoke/cache-marker.txt').read_text().strip() == 'cached fixture'
          assert not report['failures'], report['failures']
          assert any(f['id'] == 'test-eval' for f in report['findings']), report
          assert any(f['scanner'] == 'trivy' for f in report['findings']), report
          PYTHON

      - name: Upload scanner smoke-test diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: scanner-smoke-reports
          path: ${{ runner.temp }}/smoke-reports
          retention-days: 7
          if-no-files-found: warn
          overwrite: true

  maven-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Plan reactor and independent-project preparation
        env:
          SOURCE: ${{ github.workspace }}
          MAVEN_PLAN: ${{ runner.temp }}/maven-plan.json
          POM_FILES: |
            tests/maven/fixtures/reactor/pom.xml
            tests/maven/fixtures/independent/pom.xml
          JAVA_VERSION: "21"
          JAVA_DISTRIBUTION: temurin
          MAVEN_GOALS: install
          SKIP_TESTS: "true"
        run: python3 scripts/maven/prepare.py plan

      - name: Prepare reactor sibling modules and independent project
        env:
          SOURCE: ${{ github.workspace }}
          MAVEN_PLAN: ${{ runner.temp }}/maven-plan.json
        run: python3 scripts/maven/prepare.py run

      - name: Check installed artifacts
        run: |
          test -f "$HOME/.m2/repository/example/workflow/fixture/library/1.0.0-SNAPSHOT/library-1.0.0-SNAPSHOT.jar"
          test -f "$HOME/.m2/repository/example/workflow/fixture/app/1.0.0-SNAPSHOT/app-1.0.0-SNAPSHOT.jar"
          test -f "$HOME/.m2/repository/example/workflow/fixture/independent/1.0.0/independent-1.0.0.pom"
