# Copy this configuration to .github/components.yml in the calling repository.
# then edit as needed
components:
  api:
    paths:
      - apps/api
  web:
    paths:
      - apps/web
    dependency-paths:
      - pnpm-lock.yaml
  mobile:
    paths:
      - apps/mobile
    dependency-paths:
      - pnpm-lock.yaml
  data:
    paths:
      - tools/data
  infrastructure:
    paths:
      - infra
      - .github

full-scan-on-change:
  - .github/components.yml
  - .semgrepignore
  - pnpm-workspace.yaml
