name: Maven security with prepared dependencies

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  prepare-maven:
    uses: youpi0214/github-workflows/.github/workflows/maven-prepare.yml@v1.2.0
    with:
      library-ref: v1.2.0
      # List reactor roots, not every module POM. Adapt these example paths.
      pom-files: |
        services/api/pom.xml
        tools/importer/pom.xml
      java-version: "21"
      # install prepares sibling module artifacts as well as external dependencies.
      maven-goals: install
      skip-tests: true

  security:
    needs: prepare-maven
    uses: youpi0214/github-workflows/.github/workflows/security-scan.yml@v1.2.0
    with:
      library-ref: v1.2.0
      config-file: .github/security.yml
      maven-cache-key: ${{ needs.prepare-maven.outputs.cache-key }}
      # Keep online resolution enabled until cache coverage is verified.
      trivy-offline-scan: false
