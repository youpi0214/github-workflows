name: Selective monorepo security

on:
  pull_request:
  push:

permissions:
  contents: write
  pull-requests: write

jobs:
  security:
    uses: youpi0214/github-workflows/.github/workflows/security-scan.yml@v1.1.0
    with:
      library-ref: v1.1.0
      config-file: .github/security.yml
      mode: selective
      pr-comment: true
