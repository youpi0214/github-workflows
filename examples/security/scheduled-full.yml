name: Full security audit
on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  security:
    uses: youpi0214/github-workflows/.github/workflows/security-scan.yml@v1.0.0
    with:
      library-ref: v1.0.0
      mode: full
      publish: true
      retention-days: 60
      fail-severity: HIGH
